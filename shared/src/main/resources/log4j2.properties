# Reduz o ruído do Spark no console durante o desenvolvimento e os testes.
# Os logs do próprio projeto continuam em INFO.
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

logger.mineracao.name = br.uel.mineracao
logger.mineracao.level = info
